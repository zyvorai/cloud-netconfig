site_name: cloud-netconfig
site_description: Automatic network configuration for cloud instances using provider metadata (Azure, AWS, GCP, and others).
site_url: https://hypersdk.github.io/cloud-netconfig/
repo_url: https://github.com/hypersdk/cloud-netconfig
repo_name: hypersdk/cloud-netconfig
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
exclude_docs: |
  /user/PAGE_INDEX.md
  /user/pages/
  /user/pdf/
theme:
  name: material
  logo: assets/readme/zyvor-logo.svg
  favicon: assets/readme/zyvor-logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle: {icon: material/brightness-4, name: Switch to light mode}
  features: [navigation.tabs, navigation.sections, navigation.top, navigation.footer, content.code.copy, search.suggest, search.highlight, toc.follow]
plugins: [search]
hooks:
  - docs/overrides/hooks.py
extra_css:
  - stylesheets/apple-glass.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - {name: mermaid, class: mermaid, format: !!python/name:pymdownx.superfences.fence_code_format }
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
  - tables
  - toc: {permalink: true}
nav:
  - Home: index.md
  - Enterprise: enterprise.md
  - User Guide:
      - Overview: user/README.md
      - Getting started: user/getting-started.md
      - Configuration: user/configuration.md
      - Common workflows: user/workflows.md
      - Admin basics: user/admin-basics.md
      - Using cnctl (CLI): user/using-the-dashboard.md
  - Legal:
      - Overview: legal/README.md
      - Corporate reference: legal/CORPORATE.md
      - Trademark notice: legal/TRADEMARK-NOTICE.md
  - License headers: LICENSE_HEADERS.md
extra:
  social:
    - {icon: fontawesome/brands/github, link: https://github.com/hypersdk/cloud-netconfig}
